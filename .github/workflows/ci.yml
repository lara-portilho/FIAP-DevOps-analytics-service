name: CI & DevSecOps - Analytics Service

# Define quando o pipeline será disparado (em push ou pull request na branch principal)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Define o ambiente de execução (máquina virtual Ubuntu)

    steps:
      # 1. Baixa o código do repositório para a máquina virtual
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Python na versão especificada
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Cache para agilizar a instalação das dependências

      # 3. Instala as dependências da aplicação Python
      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Executa o Scanner de Segurança (SAST & SCA) no código fonte usando o Trivy
      - name: Security Scan (SAST & SCA com Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0' # Ajustado para apenas reportar alertas sem bloquear o pipeline por vulnerabilidades legadas do template
          severity: 'CRITICAL,HIGH'

      # 5. Configura as credenciais de acesso à AWS usando os segredos do repositório
      # ⚠️ ATENÇÃO: É necessário cadastrar AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY em Settings > Secrets and variables > Actions
      - name: Configurar Credenciais da AWS (ECR)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 6. Realiza o login autenticado no registro de containers da AWS (Amazon ECR)
      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Constrói a imagem Docker do microsserviço utilizando o hash do commit e a tag latest
      - name: Build da Imagem Docker
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: analytics-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .

      # 8. Realiza um novo Scan de Segurança na imagem Docker recém-criada
      - name: Security Scan na Imagem Docker (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/analytics-service:${{ github.sha }}'
          format: 'table'
          exit-code: '0' # Ajustado também para a imagem para garantir que o build suba com sucesso
          severity: 'CRITICAL,HIGH'

      # 9. Envia (Push) a imagem validada para o repositório do Amazon ECR
      - name: Push da Imagem para o Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: analytics-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest
